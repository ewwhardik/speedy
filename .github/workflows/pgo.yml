name: pgo
on:
  push:
    branches: [pgo]
jobs:
  pgo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [a, b, c]
    env:
      SLIM: rust:1-slim-trixie@sha256:1a939748a7cbab172de91a014e3804a97af1394a8c844faa67fce9401c4e40fb
      TOOLS: halloumee/speed-demon-rust:1.99.1-trixie-llvm-tools
    steps:
      - uses: actions/checkout@v4
      - name: data
        run: |
          declare -A F=([a]="track-a/full-seed1/requests.log" [b]="track-b/full-seed1/docs.txt track-b/full-seed1/queries.txt" [c]="track-c/full-seed1/records.csv track-c/full-seed1/regions.csv")
          declare -A H=([a]=495ca09682b9673ef836a506496177680bb4a3af54255174befddb1f83481cd3 [b]=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927 [c]=d8088b1cd42ba1338b1345b107b55db7b96ef1f5066f3ff64fd26a8912a0f536)
          declare -A O=([a]=summary.txt [b]=results.txt [c]=aggregates.txt)
          echo "EXPECTED=${H[${{matrix.track}}]}" >> $GITHUB_ENV; echo "OUTFILE=${O[${{matrix.track}}]}" >> $GITHUB_ENV
          mkdir -p /tmp/d; for f in ${F[${{matrix.track}}]}; do curl -s -o /tmp/d/$(basename $f) https://s3.amazonaws.com/raptors.dev/speeddemon.dev/2026/data/$f; done
          sudo ln -sfn /tmp/d /data; sudo mkdir -p /out; sudo chmod 777 /out
          docker pull -q $SLIM; docker pull -q $TOOLS
          docker run --rm $SLIM rustc -vV; docker run --rm $TOOLS rustc -vV; docker run --rm $TOOLS sh -c 'ls /usr/local/rustup/toolchains/*/lib/rustlib/*/bin/ 2>/dev/null; which llvm-profdata'
      - name: builds
        working-directory: track-${{ matrix.track }}
        run: |
          flags=$(sed -n 's/.*RUSTFLAGS="\([^"]*\)".*/\1/p' Dockerfile)
          echo "flags: $flags"
          b() { docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/src -w /src -e RUSTFLAGS="$2" -e CARGO_TARGET_DIR=/src/$3 $1 cargo build --release --offline -q; }
          b $SLIM "$flags" t-plain
          b $TOOLS "$flags -Cprofile-generate=/tmp/pgo" t-gen
          for i in 1 2 3 4 5; do rm -f /out/*; ./t-gen/release/solution; done
          prof=$(docker run --rm $TOOLS sh -c 'ls /usr/local/rustup/toolchains/*/lib/rustlib/*/bin/llvm-profdata | head -1')
          docker run --rm -u $(id -u):$(id -g) -v /tmp/pgo:/tmp/pgo -v $PWD:/src $TOOLS $prof merge -o /src/pgo.profdata /tmp/pgo
          ls -la pgo.profdata
          b $SLIM "$flags -Cprofile-use=/src/pgo.profdata" t-pgo 2>&1 | tail -15
      - name: compare
        run: |
          cd track-${{ matrix.track }}
          for v in native plain pgo; do rm -f /out/*; ./t-$v/release/solution; echo "$v $(sha256sum /out/$OUTFILE | cut -c1-64 | sed "s/$EXPECTED/PASS/")"; done
          for v in native plain pgo; do for i in 1 2 3; do ./t-$v/release/solution; done; done
          for round in $(seq 1 20); do for v in native plain pgo; do
            s=$(date +%s%N); ./t-$v/release/solution; e=$(date +%s%N); echo "$v $(( (e - s) / 1000 ))" >> /tmp/times
          done; done
          python3 -c "
          import statistics as st
          t={}
          for l in open('/tmp/times'): v,us=l.split(); t.setdefault(v,[]).append(int(us))
          for v,x in t.items(): x.sort(); print('TIME', v, 'median_us', st.median(x), 'mean_mid', round(st.mean(x[3:-3])), 'min', x[0])
          "
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-${{ matrix.track }}
          path: track-${{ matrix.track }}/pgo.profdata
